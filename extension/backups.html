<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shy Safari 備份</title>
<style>
  :root { --bg: #f6f7fb; --card: #fff; --text: #222; --muted: #666; --border: #dde1ea; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --card: #20232b; --text: #eceef3; --muted: #a3a8b5; --border: #333845; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 system-ui, "Microsoft JhengHei", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .file-label { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; border-top: 0; }
  td.actions { white-space: nowrap; text-align: right; }
  td:first-child, td.size { white-space: nowrap; }
  td.actions button { padding: 4px 10px; font-size: 14px; }
  .empty { color: var(--muted); }
  #message { min-height: 1.7em; margin: 0 0 12px; font-weight: 600; color: #1e7b45; }
  #message.error { color: #b42318; }
  input[type=file] { display: none; }
  @media (max-width: 560px) { .size { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Shy Safari 備份</h1>
  <p class="lead">備份存在這台電腦，不會被同步蓋掉。同步出問題時，可以從這裡還原到之前的狀態。</p>
  <p id="message" role="status"></p>

  <section>
    <h2>備份檔</h2>
    <p>下載一份目前雲端的紀錄自己保存，或從之前下載的備份檔還原。之前用書籤工具匯出的檔案也可以。</p>
    <div class="row">
      <button id="download-current" class="primary">下載目前的紀錄</button>
      <label class="file-label">從備份檔還原…<input id="import-file" type="file" accept=".json,application/json"></label>
    </div>
  </section>

  <section>
    <h2>自動備份</h2>
    <p>每次同步前、載入另一台電腦的紀錄前，或兩台同時使用時，都會自動存一份。最多保留 50 份。</p>
    <table>
      <thead><tr><th>時間</th><th>原因</th><th class="size">大小</th><th></th></tr></thead>
      <tbody id="backup-list"></tbody>
    </table>
  </section>
</main>
<script src="backup-store.js"></script>
<script src="backups.js"></script>
</body>
</html>
