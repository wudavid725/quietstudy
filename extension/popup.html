<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px 16px; font: 14px/1.6 system-ui, "Microsoft JhengHei", sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  dt { color: #666; }
  dd { margin: 0; }
  p { margin: 10px 0 0; color: #666; font-size: 12px; }
</style>
</head>
<body>
  <h1>Shy Safari 自動同步</h1>
  <dl>
    <dt>這台電腦</dt><dd id="local">讀取中…</dd>
    <dt>雲端最新</dt><dd id="remote">讀取中…</dd>
    <dt>使用空間</dt><dd id="usage">讀取中…</dd>
  </dl>
  <p>打開 Shy Safari 時會自動載入最新紀錄，開著的時候每 5 分鐘自動保存。要在不同電腦同步，Chrome 必須登入同一個 Google 帳號並開啟同步。</p>
  <script src="popup.js"></script>
</body>
</html>
