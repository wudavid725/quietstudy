<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px 16px; font: 14px/1.6 system-ui, "Microsoft JhengHei", sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  dt { color: #666; }
  dd { margin: 0; }
  .warning { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: #fde7e7; color: #8c1d18; }
  .ok { margin: 10px 0 0; color: #1e7b45; }
  .update { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: #e8f0fe; color: #174ea6; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #c8ccd6; background: #fff; cursor: pointer; }
  button.primary { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  #message { margin: 8px 0 0; color: #555; font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
  <h1>Shy Safari 自動同步</h1>
  <dl>
    <dt>這台電腦</dt><dd id="local">讀取中…</dd>
    <dt>雲端最新</dt><dd id="remote">讀取中…</dd>
    <dt>使用空間</dt><dd id="usage">讀取中…</dd>
    <dt>備份數量</dt><dd id="backups">讀取中…</dd>
    <dt>版本</dt><dd id="version"></dd>
  </dl>
  <p id="update" class="update" hidden></p>
  <div id="warnings"></div>
  <div class="actions">
    <button id="sync-now" class="primary">立即同步</button>
    <button id="open-backups">管理備份</button>
  </div>
  <p id="message"></p>
  <script src="popup.js"></script>
</body>
</html>
